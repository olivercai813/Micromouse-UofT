[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-path"
version = "0.1.0"
description = "Trace a path by looking at flickering squares in a Meta Quest; the UofT Micromouse drives it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
questpath = "questpath.cli:main"

[tool.setuptools]
packages = ["questpath"]

[tool.setuptools.package-data]
questpath = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
